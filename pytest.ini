[pytest]
pythonpath =
    .
    phantomnet_agent
norecursedirs = PhantomNet-v3.0
asyncio_mode = auto
markers =
    localstack: Docker-gated integration tests that require an isolated LocalStack AWS emulator.
    docker: Docker-gated non-production recovery validation that restarts isolated Redpanda and PostgreSQL services.
filterwarnings =
    ignore:Diffie-Hellman over finite fields .*:cryptography.utils.CryptographyDeprecationWarning
