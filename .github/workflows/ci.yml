name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regression-and-benchmarks:
    name: Python regression and benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            phantomnet_agent/requirements.txt

      - name: Install test and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r phantomnet_agent/requirements.txt
          python -m pip check

      - name: Run complete isolated regression suite
        run: python -m pytest -q -p no:cacheprovider

      - name: Run canonical SOC benchmark directly
        run: python scripts/benchmark_canonical_soc.py

      - name: Run resilience benchmark directly
        run: python scripts/run_resilience_stress.py --events 500

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-quality-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  dashboard-quality:
    name: Dashboard lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dashboard_frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dashboard dependencies
        run: npm install

      - name: Lint dashboard
        run: npm run lint

      - name: Build dashboard
        run: npm run build

  portal-quality:
    name: Portal lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: phantomnet-website

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install portal dependencies
        run: npm install

      - name: Lint portal
        run: npm run lint

      - name: Build portal
        run: npm run build

  quality-gate-summary:
    name: Quality Gate Summary
    needs:
      - python-regression-and-benchmarks
      - dashboard-quality
      - portal-quality
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce all required quality gates
        env:
          PYTHON_RESULT: ${{ needs.python-regression-and-benchmarks.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard-quality.result }}
          PORTAL_RESULT: ${{ needs.portal-quality.result }}
        run: |
          echo "Python regression and benchmarks: ${PYTHON_RESULT}"
          echo "Dashboard quality: ${DASHBOARD_RESULT}"
          echo "Portal quality: ${PORTAL_RESULT}"
          test "${PYTHON_RESULT}" = "success"
          test "${DASHBOARD_RESULT}" = "success"
          test "${PORTAL_RESULT}" = "success"
