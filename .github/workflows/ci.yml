name: CI — PhantomNet v4.0

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Static Code Analysis (Linting & Security SAST)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linting & Security Tools
        run: |
          pip install flake8 mypy bandit safety

      - name: Run Flake8 (Style Check)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Mypy (Type Check Check)
        run: |
          mypy --ignore-missing-imports backend_api/ shared/ phantomnet_agent/ || true

      - name: Run Bandit (Security SAST)
        run: |
          bandit -r backend_api/ shared/ phantomnet_agent/ -ll --exit-zero

      - name: Check Dependencies with Safety
        run: |
          safety check --exit-code=0

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Unit and Package Tests (Enforcing Coverage)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Service Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit & service tests
        run: |
          pytest tests/ backend_api/tests/ \
            --cov=backend_api \
            --cov=phantomnet_agent \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v --tb=short

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Container Build Verification & Security Scan
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Docker Image Build & Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend_api/gateway_service/Dockerfile
          push: false
          tags: phantomnet/gateway-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: phantomnet_agent/Dockerfile
          push: false
          tags: phantomnet/agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on Agent Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'phantomnet/agent:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Multi-Container Integration & Attack Simulation
  # ──────────────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration & Simulation Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docker-compose Services
        run: |
          docker compose up -d postgres redis redpanda neo4j gateway-service telemetry-ingestor alert-storage soar-playbook-engine
          
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to boot up..."
          sleep 15
          docker compose ps

      - name: Verify API endpoints response
        run: |
          curl -f http://localhost:8001/health || true

      - name: Clean up docker-compose
        if: always()
        run: |
          docker compose down -v
