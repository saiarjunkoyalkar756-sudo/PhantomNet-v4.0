name: Cross-Platform Source Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-source-contract:
    name: Portable agent source contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and validate agent source
        run: python scripts/check_agent_source_contract.py

      - name: Upload portable source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-agent-source-${{ matrix.os }}
          path: artifacts/agent_source_contract.json
          if-no-files-found: error
          retention-days: 14

# No hosted workflow is presented as eBPF, native-binary, Android, or Termux runtime proof.
# Those controls belong to a controlled external lab with recorded host and device evidence.
