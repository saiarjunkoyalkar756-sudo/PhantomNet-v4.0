name: Agent Source Contract

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    name: Agent source contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate portable agent source contract
        run: python scripts/check_agent_source_contract.py

      - name: Upload source-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-source-contract-${{ matrix.os }}
          path: artifacts/agent_source_contract.json
          if-no-files-found: error
          retention-days: 14

# This workflow validates source portability only. Native binary packaging, eBPF capture,
# and Android/Termux runtime behavior require their own controlled external-lab proof gates.
