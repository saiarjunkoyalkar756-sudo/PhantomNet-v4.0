name: Agent Build — PhantomNet v4.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build Agent for Linux (x86_64 & arm64)
  # ──────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Agent (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Package Agent via PyInstaller (Linux x86_64)
        run: |
          pyinstaller --onefile --name=phantomnet-agent-linux-x86_64 phantomnet_agent/main.py

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: phantomnet-agent-linux-x86_64
          path: dist/phantomnet-agent-linux-x86_64

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build Agent for Windows (x86_64)
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Agent (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Package Agent via PyInstaller (Windows x64)
        run: |
          pyinstaller --onefile --name=phantomnet-agent-windows-x64 phantomnet_agent/main.py

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: phantomnet-agent-windows-x64
          path: dist/phantomnet-agent-windows-x64.exe

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Build Agent for Termux / Android
  # ──────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Agent (Termux/Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Simulating Termux package wrapping
        run: |
          echo "Packaging Termux script environment..."
          mkdir -p dist/termux
          cp -r phantomnet_agent/* dist/termux/
          tar -czf phantomnet-agent-termux.tar.gz -C dist/termux .

      - name: Upload Termux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: phantomnet-agent-termux
          path: phantomnet-agent-termux.tar.gz
