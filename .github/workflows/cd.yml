name: Self-Hosted Deployment Reference Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-reference-validation:
    name: Render self-hosted Compose reference
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create ephemeral render environment
        run: |
          cat > /tmp/phantomnet-compose-render.env <<'EOF'
          PHANTOMNET_ENVIRONMENT=staging
          PHANTOMNET_SAFE_MODE=false
          PHANTOMNET_POSTGRES_DB=phantomnet
          PHANTOMNET_POSTGRES_USER=phantomnet
          PHANTOMNET_POSTGRES_PASSWORD=ci-ephemeral-postgres-password
          PHANTOMNET_REDIS_PASSWORD=ci-ephemeral-redis-password
          PHANTOMNET_NEO4J_PASSWORD=ci-ephemeral-neo4j-password
          PHANTOMNET_JWT_SECRET_KEY=ci-ephemeral-jwt-secret-with-more-than-32-characters
          PHANTOMNET_CONTAINMENT_AUDIT_HMAC_KEY=ci-ephemeral-containment-audit-hmac-key
          PHANTOMNET_CONTAINMENT_AUDIT_HMAC_KEY_ID=ci-ephemeral-audit-key-id
          EOF
          chmod 600 /tmp/phantomnet-compose-render.env

      - name: Validate Compose syntax and interpolation
        run: |
          docker compose \
            --env-file /tmp/phantomnet-compose-render.env \
            -f deploy/self-hosted/docker-compose.yml \
            config --quiet

      - name: Record non-deployment boundary
        run: |
          echo "Validated Compose rendering only. No Docker service was started, no cloud credential was used, and no deployment was attempted."

# This workflow is intentionally not continuous deployment. A deployment requires a
# controlled Docker-capable host, operator-provided secrets, backup/recovery evidence,
# and the Phase 7 runbook acceptance sequence.
