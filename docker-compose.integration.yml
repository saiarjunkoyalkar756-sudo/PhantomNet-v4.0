name: phantomnet-integration

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: phantomnet_test
      POSTGRES_USER: phantomnet
      POSTGRES_PASSWORD: phantomnet-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantomnet -d phantomnet_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.16
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/phantomnet-test-only
      NEO4J_server_memory_pagecache_size: 128M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  integration-tests:
    build:
      context: .
      dockerfile: infra/docker/integration-test.Dockerfile
    working_dir: /app
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/test_live_integration_topology.py"]
    environment:
      PHANTOMNET_INTEGRATION: "1"
      POSTGRES_DSN: postgresql://phantomnet:phantomnet-test-only@postgres:5432/phantomnet_test
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HTTP_URL: http://neo4j:7474/db/neo4j/tx/commit
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: phantomnet-test-only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    profiles: ["verify"]
